			shellPath = /bin/sh;
			shellScript = "# Copies the game data exported by the AGS Editor into the app bundle.\n# The file names are not known ahead of time (they depend on the game's\n# name and on whether resources were split), so this copies the folder's\n# contents rather than listing files in the project.\n#\n# No --delete: Xcode's own resources land in the same destination folder.\nset -e\n\nif [ ! -d \"${SRCROOT}/Resources\" ]; then\n  echo \"error: Resources folder is missing. Put your game's data files there.\"\n  exit 1\nfi\n\nif ! ls \"${SRCROOT}/Resources/\"*.ags >/dev/null 2>&1; then\n  echo \"error: no .ags game data found in ${SRCROOT}/Resources. Copy the contents of your game's Compiled/Data folder there.\"\n  exit 1\nfi\n\nrsync -a --exclude='.DS_Store' --exclude='.gitkeep' \\\n  \"${SRCROOT}/Resources/\" \\\n  \"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/\"\n";
		};
